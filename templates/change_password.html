{% extends 'base.html' %}

{% block title %}Change Password - Expense Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Change Password</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Update your account password</p>
    </div>
</div>

<div class="glass-card" style="max-width: 500px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            <input type="password" name="{{ field.name }}" id="{{ field.id_for_label }}" class="form-control" required>
            {% if field.errors %}
                <div style="color: var(--accent-danger); font-size: 0.8rem; margin-top: 4px;">
                    {{ field.errors.0 }}
                </div>
            {% endif %}
        </div>
        {% endfor %}

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Save New Password
            </button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
